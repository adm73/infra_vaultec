name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Create frontend embed placeholders
        run: |
          mkdir -p web/default/dist web/classic/dist
          printf '<!doctype html>\n' > web/default/dist/index.html
          printf '<!doctype html>\n' > web/classic/dist/index.html

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.9'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check default frontend
        working-directory: web/default
        run: bun run typecheck

      - name: Build default frontend
        working-directory: web/default
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: bun run build

      - name: Build classic frontend
        working-directory: web/classic
        run: bun run build
